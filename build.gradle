plugins {
    id 'java-library'
    id 'io.qameta.allure' version '4.1.0'
}

repositories {
    mavenCentral()
}

def restAssuredVersion = "6.0.1",
    slf4jVersion = "2.0.17",
    allureVersion = "2.35.3"

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.16.2",
            "org.junit.jupiter:junit-jupiter:6.1.2",
            "io.rest-assured:rest-assured:$restAssuredVersion",
            "io.rest-assured:json-schema-validator:$restAssuredVersion",
            "io.qameta.allure:allure-rest-assured:$allureVersion",
            "io.qameta.allure:allure-junit5:$allureVersion",
            "io.qameta.allure:allure-selenide:$allureVersion",
            "org.junit.platform:junit-platform-launcher",
            "net.datafaker:datafaker:2.7.0",
            "org.assertj:assertj-core:3.27.7",
            "tools.jackson.core:jackson-core:3.2.2",
            "com.fasterxml.jackson.core:jackson-databind:2.17.0",
            "org.slf4j:slf4j-simple:$slf4jVersion")

    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties(System.getProperties())

    allure {
        version = "2.33.0"
        adapter {
            aspectjWeaver.set(true)
            frameworks {
                junit5 {
                    enabled = true
                }
            }
        }
    }

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}
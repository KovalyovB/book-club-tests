plugins {
    id 'java-library'
    id 'io.qameta.allure' version '4.1.0'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.16.2",
            "org.junit.jupiter:junit-jupiter:6.1.2",
            'io.rest-assured:rest-assured:6.0.1',
            "io.rest-assured:json-schema-validator:6.0.0",
            'io.qameta.allure:allure-junit5:2.33.0',
            'io.qameta.allure:allure-selenide:2.33.0',
            "com.codeborne:selenide:7.16.2",
            'org.junit.platform:junit-platform-launcher',
            'org.slf4j:slf4j-simple:2.0.18',
            'net.datafaker:datafaker:2.7.0',
            'com.fasterxml.jackson.core:jackson-databind:2.17.0',
            'org.assertj:assertj-core:3.27.7')

    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties(System.getProperties())

    allure {
        version = "2.33.0"
        adapter {
            aspectjWeaver.set(true)
            frameworks {
                junit5 {
                    enabled = true
                }
            }
        }
    }

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}